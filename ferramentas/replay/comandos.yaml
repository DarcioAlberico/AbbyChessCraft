# O catálogo de comandos do replay da fatia (SPEC §15.4, CA-F.1).
#
# Cada comando é o caminho mais curto que a interface oferece, num passo do roadmap, para
# corrigir um tipo de diferença entre a página lida e o gabarito; `custo` é o número de
# gestos e `gestos` os descreve. O replay **simula** as correções no núcleo do programa e
# soma os custos declarados; `tests/test_custo_dos_comandos.py` confere, com QTest e um
# filtro de eventos, que o custo declarado de cada comando já existente é o que a
# interface pede. Mudar o catálogo passa pela revisão de produto (§16).
#
# As teclas dos comandos do passo 0 são as da janela de hoje (`abbychess/app/janela.py`).
# `docs/atalhos.yaml` é a tabela de destino, com o passo em que cada atalho novo entra
# (`desde_passo`); ali o Ctrl+T, por exemplo, deixa de ser o modo de treino no A2. Um
# comando que muda de tecla num passo ganha uma entrada nova com aquele `passo`.
#
# Os custos dos comandos de passos futuros (`conferir_no_passo`) são estimativas: o teste
# só confere comandos que já existem. Versão 5 (passo D1): os dois comandos do Documento
# conferidos (`espaco_no_documento`, `corrigir_no_documento`), com os custos de antes. Quando o passo os conferir, a versão do catálogo
# sobe, e a linha de base é medida de novo no worktree da tag `passo-0` com o catálogo
# novo (o `comparar` recusa catálogos diferentes). Versão 6 (pendências do L): o ensinar em
# lote (`ensinar_em_lote_da_fila`, `ensinar_em_lote`), conferido pelo teste. Versão 7: o palpite
# da rede no glifo que ninguém leu (`aceitar_palpite_da_fila`, `aceitar_palpite`), conferido.
# Versão 8: os comandos da fila para o glifo que a janela já mostra (dividir, juntar,
# descartar, sem o clique) e o Enter que confirma a leitura certa pendente, que o replay não
# cobrava; todos do passo 0, conferidos pelo teste. Desde ela, a linha de base roda o
# `replay_fatia.py` do checkout no código do passo 0 (o mesmo algoritmo dos dois lados).

versao: 8

# O que conta como um gesto (a regra do filtro de eventos do teste).
convencao_de_gestos: >-
  Um gesto é um clique (MouseButtonPress) ou uma tecla (KeyPress), espontâneos; um acorde
  (Ctrl+T, Shift+Enter) é um gesto só, porque a tecla modificadora sozinha não conta; a tecla
  que dispara um atalho conta uma vez (chega como Shortcut, não como KeyPress); arrastar é
  um gesto (o clique que começa o arraste). Digitar um caractere é um gesto.

# O que nenhum comando do passo corrige ainda: conta com um custo fixo (o trabalho de
# corrigir fora do programa ou de refazer à mão), para um passo que torna possível uma
# correção não parecer pior por somar gestos que antes ficavam de fora.
impossiveis:
  espaco: {custo: 8, motivo: "palavra junta ou partida: exportar e corrigir no editor de texto"}
  linha_nao_lida: {custo: 4, motivo: "linha que a leitura não achou: abrir o editor de texto e achar o lugar"}
  caractere_nao_lido: {custo: 1, motivo: "cada caractere da linha não achada, digitado fora do programa"}
  diagrama_nao_achado: {custo: 70, motivo: "diagrama não achado: montar a posição fora do programa"}
  nao_convergiu: {custo: 3, motivo: "diferença que o ensinar desfaz de novo pela propagação"}

comandos:
  - id: pagina_seguinte
    passo: "0"
    corrige: trocar_pagina
    custo: 1
    gestos: [Ctrl+PgDn (cada troca de página da fatia; sai em gestos_navegacao)]
  - id: reler_pendentes
    passo: "0"
    corrige: reler
    custo: 1
    gestos: [Ctrl+R (relê os pendentes com os padrões ensinados nas páginas anteriores)]
  - id: ensinar_da_fila
    passo: "0"
    corrige: substituicao_da_fila
    custo: 2
    gestos: [digitar o caractere (o glifo é o primeiro da fila, que a janela já mostra com o campo selecionado), Enter]
    efeito: ensina o padrão; depois do Enter a janela vai sozinha ao próximo da fila
  - id: ensinar_glifo
    passo: "0"
    corrige: substituicao
    custo: 3
    gestos: [clique no box (Imagem), digitar o caractere (o campo vem selecionado), Enter]
    efeito: ensina o padrão, e a propagação pode corrigir outras ocorrências
  - id: descartar_box
    passo: "0"
    corrige: sobra
    custo: 2
    gestos: [clique no box, clique em "Não é caractere" (o Del não dispara com o foco no campo)]
  - id: marcar_glifo
    passo: "0"
    corrige: falta
    custo: 4
    gestos: [Ctrl+T (modo de treino), arrastar o quadro, digitar o caractere, Shift+Enter]
  # Desde o A2: o Del vale com o foco no campo (a exceção 6 de §3.4), e marcar um glifo à mão
  # passou do Ctrl+T ao Ctrl+M. Os custos não mudam; o descartar direto da fila (o glifo já
  # mostrado, 1 gesto) pede ao replay uma regra "da fila" para sobras, como a do ensinar.
  - id: descartar_box
    passo: A2
    corrige: sobra
    custo: 2
    gestos: [clique no box, Del (o foco fica no campo do caractere)]
  - id: marcar_glifo
    passo: A2
    corrige: falta
    custo: 4
    gestos: [Ctrl+M (marcar glifo à mão), arrastar o quadro, digitar o caractere, Shift+Enter]
  - id: dividir_glifo
    passo: "0"
    corrige: divisao
    custo: 2
    gestos: [clique no box, Ctrl+D (corta no vão da tinta)]
  # Versão 8: o glifo que a janela já mostra (o primeiro da fila) não pede o clique. O replay
  # anda pela fila: o que ela mostra e a medida não cobre (fora das linhas verificadas) é
  # transparente; o certo e pendente numa linha medida custa o Enter que o confirma.
  - id: confirmar_da_fila
    passo: "0"
    corrige: confirmacao_da_fila
    custo: 1
    gestos: [Enter (o campo vem com a leitura certa, selecionada)]
    efeito: ensina o padrão da leitura; depois do Enter a janela vai ao próximo da fila
  - id: dividir_da_fila
    passo: "0"
    corrige: divisao_da_fila
    custo: 1
    gestos: [Ctrl+D (o glifo já mostrado)]
  - id: juntar_da_fila
    passo: "0"
    corrige: juncao_da_fila
    custo: 1
    gestos: [Ctrl+J (o glifo já mostrado com o seguinte da linha)]
  - id: descartar_da_fila
    passo: "0"
    corrige: sobra_da_fila
    custo: 1
    gestos: [clique em "Não é caractere" (o glifo já mostrado; desde o A2, o Del também)]
  - id: juntar_glifos
    passo: "0"
    corrige: juncao
    custo: 2
    gestos: [clique no primeiro box, Ctrl+J (junta com o seguinte da linha)]
  - id: abrir_diagrama
    passo: "0"
    corrige: abrir_diagrama
    custo: 1
    gestos: [clique no diagrama (abre a conferência)]
  - id: corrigir_casa
    passo: "0"
    corrige: casa
    custo: 2
    gestos: [clique na casa, tecla da peça (ou Delete)]
  - id: corrigir_lado
    passo: "0"
    corrige: lado
    custo: 1
    gestos: [clique no lado a jogar (brancas ou pretas) na conferência]
  - id: fechar_diagrama
    passo: "0"
    corrige: fechar_diagrama
    custo: 1
    gestos: [Ctrl+Enter (conferido)]
  - id: espaco_no_documento
    passo: D1
    corrige: espaco
    custo: 2
    gestos: [clique no ponto do Documento, espaço ou Backspace (confirma ao sair da palavra)]
  - id: corrigir_no_documento
    passo: D1
    corrige: substituicao
    custo: 3
    gestos: [clique depois do caractere errado no Documento, Backspace, digitar o certo]
    efeito: corrige sem ensinar (o replay o usa depois que o caractere já foi ensinado)
  # A confusão do livro corrigida em lote: o Ctrl+Enter no lugar do Enter ensina o glifo e
  # corrige, sem ensinar, os outros da página com a mesma leitura que a palavra desmente
  # (`contexto.lote`: o "0" de "c0l0ca", não o de "1.e4"). O replay o usa no lugar do ensinar
  # quando o lote acerta mais glifos do que estraga, pelo gabarito.
  - id: ensinar_em_lote_da_fila
    passo: L
    corrige: confusao_da_fila
    custo: 2
    gestos: [digitar o caractere (o glifo é o primeiro da fila, já mostrado), Ctrl+Enter]
    efeito: ensina o padrão e corrige o lote da página num passo do desfazer; depois, a propagação
  - id: ensinar_em_lote
    passo: L
    corrige: confusao
    custo: 3
    gestos: [clique no box (Imagem), digitar o caractere (o campo vem selecionado), Ctrl+Enter]
    efeito: o mesmo, para um glifo fora da vez da fila
  # O palpite da rede no glifo que ninguém leu (§9.2): o campo vem com o primeiro da rede
  # abaixo do limiar, selecionado, e o Enter o ensina. O replay o usa quando o palpite é o
  # certo do gabarito; errado, digitar o troca e o ensinar custa o de sempre.
  - id: aceitar_palpite_da_fila
    passo: L
    corrige: palpite_da_fila
    custo: 1
    gestos: [Enter (o glifo sem leitura é o primeiro da fila, já mostrado com o palpite no campo)]
    efeito: ensina o palpite como padrão; depois do Enter a janela vai ao próximo da fila
  - id: aceitar_palpite
    passo: L
    corrige: palpite
    custo: 2
    gestos: [clique no box (Imagem), Enter (o campo vem com o palpite)]
    efeito: o mesmo, para um glifo fora da vez da fila
